# Build the OCI image for mcl-jobs and push to the registry.
#
# TWO CHANNELS, AND ONLY A SIGNED RELEASE MOVES :latest.
#
#   push of v*   : publishes :<semver>, then :latest once attest signed it <- what macula-fleet pins and deploys
#   push to main : publishes :main and :<sha>                              <- the tip, for trying; nothing follows it
#
# :latest is what anyone outside the fleet pulls, and what deploy/docker-compose.yml
# runs, so it names a signed release and never an unreviewed tip of main
# (mcl-jobs#9). scripts/image_tags.sh says which tags a ref publishes, and
# mcl_jobs_image_channels_tests holds this file to it.
#
# The semver tags stay published so a bad release can be pinned back to a known
# one. A green `v*` tag IS the deploy: macula-fleet's pin-releases workflow takes
# the newest signed `X.Y.Z` on this image's track, verifies its signature, SBOM and
# provenance, and commits `<version>@sha256:<digest>` to its own tree, canary first
# (macula-fleet `edge/gitops/release-targets`:78-79; macula-fleet#14). A push to
# main deploys nothing: the boxes instead run the digest that pin names.
#
# NO PATH FILTER, ON PURPOSE. A docs-only push would build an image nothing
# follows, but `paths-ignore' cannot be trusted with that: on the push
# that CREATES a branch GitHub evaluates it on the head commit alone, so a first
# push ending in a README edit silently built no image. scripts/is_image_push.sh
# decides from the pushed range instead, and builds whenever it cannot tell.
# If an image is ever missing anyway, run this workflow by hand.
#
# NOTE ON PUSHING THIS FILE. An HTTPS push that creates or updates anything under
# .github/workflows/ needs a token carrying the `workflow' scope, and the error
# names the FILE rather than the missing scope. Use an SSH remote and the problem
# does not arise.

name: build-and-push

on:
  push:
    branches: [main]
    tags:     ['v*']
  workflow_dispatch:

# ONE IMAGE BUILD IN FLIGHT PER REF. Without this, three quick commits run
# three builds that finish in whatever order the runners please, and :main
# could end up naming the older one. A sibling service hit exactly that live.
# A newer push to a branch or tag QUEUES behind the run in flight, never
# cancels it: a cancelled run could already have pushed its image and not yet
# signed it (mcl-om#9). Pull-request runs push nothing, so they still cancel.
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # REFUSED BEFORE ANYTHING IS PUSHED: a v* tag off the default branch (or off its
  # line's release-<major>.<minor> branch), or whose version is not the one this
  # repository publishes, stops here, so a refused tag leaves no image on the
  # registry. Any other ref passes. attest-image checks the same again before it
  # signs. Pinned by full commit sha, as the attest call is.
  guard:
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/release-guard.yml@b4c41abb404c32215a2823b7f19ac65b732e1dfe
    with:
      runs-on: '["ubuntu-latest"]'

  # NO IMAGE WHILE ITS OWN TESTS ARE RED. lint.yml, called on the commit this
  # run builds, and the build waits on it (mcl-om#34).
  test:
    uses: ./.github/workflows/lint.yml

  build-and-push:
    needs: [guard, test]
    runs-on: ["ubuntu-latest"]
    permissions:
      contents: read
      packages: write
    # The digest the push produced: the one the attest job signs.
    outputs:
      digest: ${{ steps.digest.outputs.digest }}

    steps:
      # The whole history, so the gate below can diff the pushed range.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this push need an image?
        id: gate
        run: scripts/is_image_push.sh "${{ github.event.before }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # PLAIN `docker' CLI STEPS, NO docker/* ACTIONS, so the job runs on a
      # GitHub-hosted runner (docker) and on a runner whose `docker' is
      # a shim for podman alike. docker/build-push-action needs Docker's buildx,
      # which podman is not.
      #
      # THE LOGIN GOES TO THIS JOB'S OWN FILES, DOCKER_CONFIG for docker and
      # REGISTRY_AUTH_FILE for podman, both under $RUNNER_TEMP. Runners on one
      # box can share one podman and its default auth file, and a token written
      # there is readable by, and overwritten by, the other runners' jobs.
      - name: Log in to the registry
        if: steps.gate.outputs.build == 'true'
        id: login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/auth.json" >> "$GITHUB_ENV"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config" REGISTRY_AUTH_FILE="$RUNNER_TEMP/auth.json"
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The COMPLETE tag list, from one script, so its one case governs all of
      # it: a v* tag publishes its version only, main :main and :<sha>, and any
      # other ref (the workflow can be run by hand from any branch) is refused,
      # naming it. None of them is :latest; promote-latest moves that.
      - name: Set tags
        if: steps.gate.outputs.build == 'true'
        id: tag
        run: scripts/image_tags.sh >> "$GITHUB_OUTPUT"

      # BUILT UNDER A TAG UNIQUE TO THIS RUN, then tagged for the registry and
      # pushed. A shared image store sees every runner's builds, and the run id
      # keeps two of them from racing on one local name. REVISION is the commit
      # the image was built from, readable from the image itself.
      #
      # BUILDAH_FORMAT: podman builds OCI by default, and OCI has no
      # HEALTHCHECK, so the image would silently lose the one the Containerfile
      # declares. docker ignores the variable.
      - name: Build and push
        if: steps.gate.outputs.build == 'true'
        id: build
        env:
          BUILDAH_FORMAT: docker
          LOCAL: mcl-jobs:ci-${{ github.run_id }}-${{ github.run_attempt }}
          TAGS: ${{ steps.tag.outputs.tags }}
        run: |
          docker build --file Containerfile --build-arg REVISION=${{ github.sha }} --tag "$LOCAL" .
          for tag in $TAGS; do
              docker tag "$LOCAL" "$tag"
              docker push "$tag"
          done

      # THE DIGEST THE PUSH PRODUCED, read back from the registry by the tag
      # just pushed: the steps above are plain docker CLI (they must run on a
      # podman shim too), so no action reports it. The concurrency group keeps
      # another build of this ref from moving the tag in between.
      - name: Resolve the pushed digest
        if: steps.gate.outputs.build == 'true'
        id: digest
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ steps.tag.outputs.tags }}
        run: |
          tag="${TAGS%% *}"
          digest=$(curl -fsSI -H "Authorization: Bearer $(printf %s "$TOKEN" | base64 -w0)" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/macula-services/mcl-jobs/manifests/${tag##*:}" \
            | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p')
          case "$digest" in
            sha256:*) echo "digest=$digest" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::the registry named no digest for $tag"; exit 1 ;;
          esac

      # BY NAME, NEVER BY WILDCARD: on a shared image store, a wildcard removal
      # takes other jobs' images mid-run. Keyed on the LOGIN, so the credentials go
      # even when a step between login and build failed; an image that was
      # never built is skipped. A red job here after a green push means the
      # image is published and only this cleanup failed.
      - name: Remove this run's images and credentials
        if: always() && steps.login.outcome != 'skipped'
        env:
          LOCAL: mcl-jobs:ci-${{ github.run_id }}-${{ github.run_attempt }}
          TAGS: ${{ steps.tag.outputs.tags }}
        run: |
          for image in "$LOCAL" $TAGS; do
              if docker image inspect "$image" >/dev/null 2>&1; then docker rmi "$image"; fi
          done
          rm -rf "$RUNNER_TEMP/docker-config" "$RUNNER_TEMP/auth.json"

  # SIGNED BY DIGEST, SBOM AND PROVENANCE ATTESTED, keyless, so a box can refuse any
  # digest of this image that did not come from this workflow on a commit of this
  # repository (a box that verifies signatures refuses one before it runs it). Pinned
  # by full commit sha: the signing identity is that file at that ref. Runs on the
  # build's own runner. See macula-ci-images' README.
  attest:
    needs: build-and-push
    if: needs.build-and-push.outputs.digest != ''
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: macula-io/macula-ci-images/.github/workflows/attest-image.yml@fa59fba58d1b65dce35f8613dcb257273a0f29ed
    with:
      image: ghcr.io/macula-services/mcl-jobs
      digest: ${{ needs.build-and-push.outputs.digest }}
      runs-on: '["ubuntu-latest"]'

  # :latest MOVES LAST, ONLY ON A v* TAG, AND ONLY ONCE attest HAS SIGNED AND
  # ATTESTED THIS DIGEST. Anything following :latest in the window between push
  # and signature would otherwise pull a digest nothing signed yet. The same
  # manifest bytes go under :latest (scripts/promote_latest.sh, proven by
  # scripts/promote_latest_test.sh in lint.yml), so :latest is the signed digest
  # and not a re-wrapped copy of it.
  #
  # AND NEVER BACKWARDS. The build's concurrency group is per ref, so two tags
  # build in parallel and finish in either order, and a patch to an older line
  # finishes last by design. So promotions run one at a time, repository-wide,
  # and each moves :latest only if its tag is the newest plain release
  # (scripts/is_newest_release.sh); an older one leaves :latest alone. GitHub
  # keeps one PENDING run per group, so a third promotion queued behind two
  # cancels the waiting one: at worst :latest stays on an older signed release
  # until the newest tag's promote-latest is re-run, never on a newer-then-older.
  promote-latest:
    needs: [build-and-push, attest]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-and-push.outputs.digest != ''
    runs-on: ["ubuntu-latest"]
    concurrency:
      group: promote-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      # Every tag, so the newest one is known at the moment of promotion.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is this the newest release?
        id: newest
        run: |
          git fetch --force --tags origin
          scripts/is_newest_release.sh "${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Point :latest at the signed digest
        if: steps.newest.outputs.promote == 'true'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/promote_latest.sh ghcr.io/macula-services/mcl-jobs "${{ needs.build-and-push.outputs.digest }}"
